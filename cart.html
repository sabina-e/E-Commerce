<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.cart-item img{
    width:80px;
    border-radius:10px;
}

button{
    background:#7A6552;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.total{
    margin-top:30px;
    text-align:right;
}

a{
    text-decoration:none;
}
</style>

</head>
<body>

<header class="header">

<div class="logo">
<h2>BINA</h2>
</div>

<nav>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="cart.html">Cart</a></li>

</ul>

</nav>

</header>

<div class="container">

<h1>Your Cart</h1>

<br>

<div id="cart-items"></div>

<div class="total">

<h2>Total : <span id="total-price">₹0</span></h2>

<br>

<button onclick="checkout()">
Proceed To Checkout
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
